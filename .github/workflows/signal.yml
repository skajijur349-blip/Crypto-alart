name: Signal Charts

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true = send test charts once.  false = start the live 3-minute checker now"
        default: "true"

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python signal_charts.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || github.event.inputs.test == 'false') && '340' || '0' }}
