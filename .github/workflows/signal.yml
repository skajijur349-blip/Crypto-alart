name: Signal Charts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/signal.yml"
      - "signal_charts.py"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "false = live 3-minute checker (default).  true = send test charts once and stop"
        default: "false"

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python signal_charts.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true') && 'true' || 'false' }}
          LOOP_MINUTES: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true') && '0' || '340' }}
